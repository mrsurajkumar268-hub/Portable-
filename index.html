<!DOCTYPE html>
<html>
<head>
<style>
body{
  background:#111;
  text-align:center;
  padding-top:100px;
}

.box{
  border:3px solid cyan;
  padding:40px;
  width:350px;
  margin:auto;
  border-radius:20px;
}

.spinner{
  margin:auto;
  width:50px;
  height:50px;
  border:6px solid #555;
  border-top:6px solid cyan;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

h1{
  color:#00ffff;
}

@keyframes spin{
  100%{transform:rotate(360deg);}
}
</style>
</head>

<body>

<div class="box">
  <div class="spinner"></div>
  <h1>SURAj KUMAR</h1>
</div>

</body>
</html>
